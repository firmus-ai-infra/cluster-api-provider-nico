# Serve the admission webhook: the port the Service targets and the cert-manager issued serving certificate.
- op: add
  path: /spec/template/spec/containers/0/ports/-
  value:
    containerPort: 9443
    name: webhook-server
    protocol: TCP
- op: add
  path: /spec/template/spec/containers/0/volumeMounts
  value:
    - mountPath: /tmp/k8s-webhook-server/serving-certs
      name: cert
      readOnly: true
- op: add
  path: /spec/template/spec/volumes
  value:
    - name: cert
      secret:
        defaultMode: 420
        secretName: webhook-server-cert
