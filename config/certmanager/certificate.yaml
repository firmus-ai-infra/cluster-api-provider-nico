# The webhook serving certificate, issued by cert-manager (a prerequisite of every Cluster API management
# cluster: clusterctl and the Cluster API Operator install it). The CA is injected into the
# ValidatingWebhookConfiguration by the cert-manager.io/inject-ca-from annotation set in config/default.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: capnico-system
  labels:
    app.kubernetes.io/name: cluster-api-provider-nico
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: serving-cert
  namespace: capnico-system
  labels:
    app.kubernetes.io/name: cluster-api-provider-nico
spec:
  # SERVICE_NAME and SERVICE_NAMESPACE are replaced from the webhook Service by config/default.
  dnsNames:
    - SERVICE_NAME.SERVICE_NAMESPACE.svc
    - SERVICE_NAME.SERVICE_NAMESPACE.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: webhook-server-cert
